{% load static %}
<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2a4057">
  <title>Acceso a Gestión Dulcecita</title>
  <link rel="icon" href="{% static 'img/favicon.ico' %}" sizes="48x48">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'img/favicon-32.png' %}">
    <link rel="apple-touch-icon" href="{% static 'img/apple-touch-icon.png' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'gestion/panel.css' %}?v=2" rel="stylesheet">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="login-head">
      <img src="{% static 'img/logo-dulcecita-rosado.png' %}" alt="Dulcecita" class="login-logo" width="170" height="64">
    </div>
    <div class="login-body">
      <h1 class="login-title">Gestión</h1>
      <p class="login-sub">Pedidos, clientes y costos del negocio</p>

      {% if form.errors %}
        <div class="login-error" role="alert">Usuario o contraseña incorrectos.</div>
      {% endif %}

      <form method="post" action="{% url 'gestion:login' %}">
        {% csrf_token %}
        <div class="field">
          <label class="form-label" for="{{ form.username.id_for_label }}">Usuario</label>
          {{ form.username }}
        </div>
        <div class="field">
          <label class="form-label" for="{{ form.password.id_for_label }}">Contraseña</label>
          {{ form.password }}
        </div>
        <input type="hidden" name="next" value="{{ request.GET.next }}">
        <button type="submit" class="btn btn-dc btn-login">Entrar</button>
      </form>

      <p class="login-foot">Acceso privado de Dulcecita</p>
    </div>
  </main>
</body>
</html>
