# La base NO vive en Render: se migro a Neon (verificado 12-10-2026). La base
# free de Render (dulcecitaa-db) se borraba el 14-10. Si este archivo la volviera
# a declarar, una sincronizacion del blueprint podria crear una base vacia y
# conectar la web a ella. Por eso no hay bloque `databases`.

services:
  - type: web
    name: dulcecitaa
    runtime: python
    plan: starter          # el servicio esta en Starter; con "free" un sync lo bajaria
    branch: main
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate --no-input && python manage.py seed_data && python manage.py catalogo_inicial && python manage.py sembrar_preguntas --confirmar --solo-si-vacio && python manage.py clave_panel"
    startCommand: "gunicorn reposteria.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: BRAND_NAME
        value: "Dulcecita"
      - key: WEBSITE_URL          # base para link del footer y logo de los correos
        value: "https://dulcecita.cl"
      # Cadena de Neon, puesta a mano en el dashboard (Environment). sync: false
      # = Render conserva el valor que ya tiene y nunca lo pisa.
      - key: DATABASE_URL
        sync: false
      # Cloudinary: pega el valor en el dashboard de Render (Environment).
      # NO se versiona aquí porque contiene el API secret.
      - key: CLOUDINARY_URL
        sync: false
      # Acceso a /panel. Se ponen a mano en el dashboard cuando hay que crear el
      # usuario o resetear la clave; despues se BORRA PANEL_PASSWORD. Sin ellas
      # el comando clave_panel no hace nada.
      - key: PANEL_USER
        sync: false
      - key: PANEL_PASSWORD
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: WEB_CONCURRENCY
        value: "4"
      # ── Correo (SMTP) ──────────────────────────────────────────────
      # Sin EMAIL_HOST_USER/PASSWORD los correos de pedido NO se envian.
      # Pega los valores en el dashboard de Render (Environment).
      #
      # Desde el 15-09-2026 sale por Brevo y NO por Gmail: el remitente es
      # pedidos@dulcecita.cl, que esta autenticado (SPF + DKIM) en el DNS.
      # El PUERTO ES 2525 a proposito: Render bloquea el 587 en los planes
      # Free. Estos dos valores estaban fijos en "smtp.gmail.com" y "587", asi
      # que sincronizar el blueprint habria pisado la configuracion buena y
      # dejado a la duena otra vez sin aviso de pedidos.
      - key: EMAIL_HOST
        value: "smtp-relay.brevo.com"
      - key: EMAIL_PORT
        value: "2525"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER          # el login SMTP de Brevo (xxxx@smtp-brevo.com)
        sync: false
      - key: EMAIL_HOST_PASSWORD      # la SMTP key de Brevo (empieza con xsmtpsib-)
        sync: false
      - key: DEFAULT_FROM_EMAIL       # ej: Dulcecita <tucorreo@gmail.com>
        sync: false
      - key: CONTACT_EMAIL            # donde te llegan los pedidos
        sync: false
      # ── Medicion y SEO ─────────────────────────────────────────────
      # Declaradas con sync: false para que sincronizar el blueprint NO las
      # borre: sin ellas el sitio deja de medir sin avisar. Valores en el panel.
      - key: GA4_ID                   # G-Z43PVM60CH (Google Analytics 4)
        sync: false
      - key: CLARITY_ID               # Microsoft Clarity
        sync: false
      - key: GTM_ID                   # opcional, Google Tag Manager
        sync: false
      - key: META_PIXEL_ID            # opcional, anuncios de Instagram/Facebook
        sync: false
      - key: GOOGLE_SITE_VERIFICATION # no hace falta: dominio verificado por DNS
        sync: false
      # ── Pago por transferencia (datos de la duena, nunca en el codigo) ──
      - key: TRANSFER_TITULAR
        sync: false
      - key: TRANSFER_RUT
        sync: false
      - key: TRANSFER_BANCO
        sync: false
      - key: TRANSFER_TIPO_CUENTA
        sync: false
      - key: TRANSFER_NUMERO
        sync: false
      - key: TRANSFER_EMAIL
        sync: false
